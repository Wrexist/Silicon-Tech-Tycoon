name: 3D models

# Validates office/factory GLB models against scripts/models/manifest.json
# (docs/WORLDS_3D_PIPELINE.md): material names, triangle budget, floor pivot,
# orientation, clips, file size. The shipped Kenney kit is recognised by hash
# and only reported.

on:
  pull_request:
    paths:
      - '.github/workflows/models-check.yml'
      - 'public/furniture/**'
      - 'public/factory/**'
      - 'src/garage3d/models/**'
      - 'scripts/models/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install trimesh numpy
      - name: Check models
        run: python scripts/models/check_glb.py
