name: Store media
on:
  workflow_dispatch:
    inputs:
      screenshot_run_id:
        description: Reuse reviewed screenshots from this media artifact run; render the trailer only
        required: false
        type: string
  pull_request:
    paths:
      - scripts/store-media-1.4.mjs
      - scripts/trailer/**
      - scripts/stage-showcase.mjs
      - .github/workflows/store-media.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: store-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run shots:stage:showcase
      - run: npx playwright-core install --with-deps chromium
      - name: Install preview encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture all store screenshots
        if: ${{ inputs.screenshot_run_id == '' }}
        run: node scripts/store-media-1.4.mjs
      - name: Reuse reviewed screenshots
        if: ${{ inputs.screenshot_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: silicon-store-media-1.4.0
          path: appstore/release-1.4.0
          run-id: ${{ inputs.screenshot_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-store-screenshots-1.4.0
          path: |
            appstore/release-1.4.0/iphone/
            appstore/release-1.4.0/ipad/
            appstore/release-1.4.0/capture-report.json
      # The preview is the cinematic edit in scripts/trailer: directed camera moves through the real
      # Office and Factory plus live UI clips, every frame stepped on a fake clock (no drops).
      - name: Start the dev server for the directed capture
        run: |
          nohup npx vite --port 5191 --strictPort --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5191 >/dev/null && exit 0; sleep 2; done
          cat /tmp/vite.log; exit 1
      - name: Capture trailer clips
        env:
          TRAILER_OUT: /tmp/cine
        run: node scripts/trailer/capture.mjs
      - name: Edit and encode the App Store preview
        env:
          TRAILER_OUT: /tmp/cine
        run: |
          node scripts/trailer/compose.mjs
          mkdir -p appstore/release-1.4.0/preview
          cp /tmp/cine/Silicon-1.4.0-iPhone.mp4 /tmp/cine/poster.png appstore/release-1.4.0/preview/
      - name: Verify preview encoding
        run: ffprobe -v error -show_streams -show_format -of json appstore/release-1.4.0/preview/Silicon-1.4.0-iPhone.mp4 > appstore/release-1.4.0/preview/ffprobe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silicon-store-media-1.4.0
          path: |
            appstore/release-1.4.0/iphone/
            appstore/release-1.4.0/ipad/
            appstore/release-1.4.0/preview/
            appstore/release-1.4.0/capture-report.json
          if-no-files-found: warn
