name: Store media
on:
  workflow_dispatch:
    inputs:
      screenshot_run_id:
        description: Reuse reviewed screenshots from this media artifact run
        required: false
        type: string
      trailer_release:
        description: Draft release tag holding the reviewed trailer (scripts/trailer, rendered on a GPU)
        required: false
        type: string
  pull_request:
    paths:
      - scripts/store-media-1.4.mjs
      - scripts/stage-showcase.mjs
      - .github/workflows/store-media.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: store-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Reading a DRAFT release needs write scope on contents; it is used for nothing else.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run shots:stage:showcase
      - run: npx playwright-core install --with-deps chromium
      - name: Install preview encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture all store screenshots
        if: ${{ inputs.screenshot_run_id == '' }}
        run: node scripts/store-media-1.4.mjs
      - name: Reuse reviewed screenshots
        if: ${{ inputs.screenshot_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: silicon-store-media-1.4.0
          path: appstore/release-1.4.0
          run-id: ${{ inputs.screenshot_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-store-screenshots-1.4.0
          path: |
            appstore/release-1.4.0/iphone/
            appstore/release-1.4.0/ipad/
            appstore/release-1.4.0/capture-report.json
      # The preview is the cinematic edit in scripts/trailer, rendered on a GPU machine (software
      # WebGL here takes ~19s a frame). It arrives as a DRAFT release asset, visible only to
      # collaborators, named by trailer_release; the store media artifact then carries it.
      - name: Fetch the reviewed trailer
        if: ${{ inputs.trailer_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.trailer_release }}
        run: |
          mkdir -p appstore/release-1.4.0/preview
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'Silicon-1.4.0-iPhone.mp4' -D appstore/release-1.4.0/preview --clobber
      - name: Verify preview encoding
        if: ${{ inputs.trailer_release != '' }}
        run: ffprobe -v error -show_streams -show_format -of json appstore/release-1.4.0/preview/Silicon-1.4.0-iPhone.mp4 > appstore/release-1.4.0/preview/ffprobe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silicon-store-media-1.4.0
          path: |
            appstore/release-1.4.0/iphone/
            appstore/release-1.4.0/ipad/
            appstore/release-1.4.0/preview/
            appstore/release-1.4.0/capture-report.json
          if-no-files-found: warn
