name: iOS build check

# Compile-only guard for the iOS target.
#
# WHY THIS EXISTS: the TestFlight workflow is `workflow_dispatch` only and needs App Store Connect
# secrets, a provisioning round-trip and ~40 minutes, so Swift compile errors in ios/App/App/*.swift
# used to reach us one at a time through manual release builds. Three separate releases were burned
# on trivial compile errors that this job would have caught in minutes:
#   • RevenueCatConfig.swift / SiliconStoreKit+RevenueCat.swift not registered in project.pbxproj
#   • `SubscriptionPeriod` ambiguous between the RevenueCat and StoreKit modules
#   • `jwsRepresentation` read off `AppTransaction` instead of its `VerificationResult` wrapper
#
# This job builds the same scheme with signing disabled, so it needs NO secrets and runs on every
# PR. It does not archive, export or upload anything.

on:
  pull_request:
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build-check.yml"
      - ".github/workflows/ios-testflight-capacitor.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build-check.yml"
      - ".github/workflows/ios-testflight-capacitor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (iOS)
        # Regenerates Package.swift and copies dist/ → ios/App/App/public, exactly as the
        # TestFlight workflow does — the Xcode target does not build without it.
        run: npx cap sync ios

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build (no signing)
        # CODE_SIGNING_ALLOWED=NO keeps this secret-free: we only care whether the Swift compiles.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
