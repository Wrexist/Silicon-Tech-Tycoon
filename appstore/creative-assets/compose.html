<!doctype html>
<!--
  App Store creative assets (iOS 27 "Header and Search Results") for Silicon: Tech Tycoon.
  Rendered by render.mjs at Apple's exact canvases (CSS size = half, device scale 2):
    ?asset=header     -> 3840 x 1646 (21:9 product page header, no text)
    ?asset=search     -> 3840 x 2560 (3:2 search results, headline)
    ?asset=universal  -> 5244 x 2950 (16:9, fills both placements, no text)
  The art is two real in-game renders (scripts/trailer/stills.mjs: directed camera, real scene):
  the Office team on the left melting into the Factory line on the right, joined by a seam of light.
  The focal pair sits on the centre line, so Apple's per-device crops only trim the outer edges; the
  bottom stays calm for the App Store's own overlay. No prices, URLs, awards or real brands.
-->
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #070b12; }
  #c { position: relative; overflow: hidden; background: #0b1018; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #f5f8fc; }
  .plate { position: absolute; top: 0; height: 100%; width: 100%; object-fit: cover; }
  .office { left: 0; transform: translate(var(--office-x), var(--plate-y, 0)) scale(1.04); transform-origin: 30% 50%; filter: saturate(1.1) contrast(1.05); }
  .factory { left: 0; transform: translate(var(--factory-x), var(--plate-y, 0)) scale(1.04); transform-origin: 70% 50%; filter: saturate(1.08) contrast(1.06) brightness(.98);
    -webkit-mask-image: linear-gradient(100deg, transparent 38%, #000 60%); mask-image: linear-gradient(100deg, transparent 38%, #000 60%); }
  /* the seam: a soft beam of brand light where the two worlds meet */
  .beam { position: absolute; inset: 0; mix-blend-mode: screen;
    background:
      radial-gradient(14% 70% at 50% 46%, rgba(96,165,250,.38) 0%, rgba(59,130,246,.12) 45%, transparent 100%),
      radial-gradient(4% 60% at 50% 44%, rgba(191,219,254,.35) 0%, transparent 100%); }
  .warm { position: absolute; inset: 0; mix-blend-mode: soft-light; background: radial-gradient(40% 60% at 22% 45%, rgba(255,190,120,.35), transparent 70%); }
  .cool { position: absolute; inset: 0; mix-blend-mode: soft-light; background: radial-gradient(40% 60% at 80% 50%, rgba(120,170,255,.35), transparent 70%); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(85% 95% at 50% 45%, transparent 55%, rgba(3,6,12,.72) 100%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, transparent, rgba(5,8,14,.78)); }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 40%; background: linear-gradient(180deg, rgba(5,8,14,.55), transparent); }
  .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; }
  .copy { position: absolute; left: 6%; top: 7.5%; }
  /* search: both worlds drop below a calm band that carries the headline */
  .search .top { height: 62%; background: linear-gradient(180deg, #080c14 0%, #080c14 34%, rgba(8,12,20,.82) 46%, transparent 100%); }
  .search .beam { top: 22%; }
  .eyebrow { font-size: 30px; font-weight: 650; letter-spacing: 9px; color: #a9b8cc; margin-bottom: 26px; }
  .h { font-size: 118px; line-height: 1; font-weight: 800; letter-spacing: -4.5px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  .h b { color: #8cb5ff; font-weight: 800; }
  .sub { margin-top: 30px; font-size: 40px; font-weight: 550; color: #d6e0ee; letter-spacing: -.3px; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
</style></head>
<body><div id="c">
  <img class="plate office" id="office">
  <img class="plate factory" id="factory">
  <div class="warm"></div><div class="cool"></div><div class="beam"></div>
  <div class="top"></div><div class="floor"></div><div class="vignette"></div>
  <svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="copy" id="copy" hidden>
    <div class="eyebrow">SILICON · TECH TYCOON</div>
    <div class="h">Build your<br><b>tech empire.</b></div>
    <div class="sub">Run the studio. Build the factory. Beat every rival.</div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search), asset = q.get('asset'), root = q.get('root');
  const SIZE = { header: [1920, 823], search: [1920, 1280], universal: [2622, 1475] }[asset];
  const c = document.getElementById('c');
  c.style.width = SIZE[0] + 'px'; c.style.height = SIZE[1] + 'px';
  // the wider the canvas, the further apart the two worlds sit
  const spread = { header: ['-17%', '19%'], search: ['-12%', '14%'], universal: ['-14%', '16%'] }[asset];
  c.style.setProperty('--office-x', spread[0]); c.style.setProperty('--factory-x', spread[1]);
  document.getElementById('office').src = `${root}/plates/${asset}-office.png`;
  document.getElementById('factory').src = `${root}/plates/${asset}-factory.png`;
  if (asset === 'search') { document.getElementById('copy').hidden = false; c.classList.add('search'); c.style.setProperty('--plate-y', '24%'); }
</script></body></html>
