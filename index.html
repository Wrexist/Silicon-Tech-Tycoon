<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Silicon" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Design tech products, time the market, and build a global tech empire." />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Silicon: Tech Tycoon" />
    <meta property="og:description" content="Design tech products, time the market, and build a global tech empire. Premium, offline, no ads." />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Silicon: Tech Tycoon" />
    <meta name="twitter:description" content="Design tech products, time the market, and build a global tech empire." />
    <meta name="twitter:image" content="./icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png" />
    <title>Silicon: Tech Tycoon</title>
    <!-- Boot splash — inlined so it paints on first parse (before the JS/CSS bundle loads) and hands
         off seamlessly from the native launch screen: same dark field + chip mark, now with motion
         and a real loading bar that runs while the bundle parses and the game state hydrates.
         main.tsx fills it to 100% and fades it out once React has mounted. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background:
          radial-gradient(60% 40% at 50% 42%, #16203a 0%, rgba(15, 17, 21, 0) 70%),
          #0f1115;
        opacity: 1;
        transition: opacity 440ms cubic-bezier(0.4, 0, 0.2, 1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      .boot__logo {
        width: 92px;
        height: 92px;
        /* The mark carries its own bloom now, so this is only the grounding shadow — stacking the
           old 22px blue drop-shadow on top of it washed the glow into a smear. */
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
        animation: boot-rise 620ms cubic-bezier(0.2, 0.7, 0.2, 1) both, boot-breathe 3.4s ease-in-out 0.7s infinite;
      }
      .boot__logo svg { width: 100%; height: 100%; display: block; }
      .boot__word {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #f4f5f7;
        animation: boot-rise 620ms cubic-bezier(0.2, 0.7, 0.2, 1) 80ms both;
      }
      .boot__bar {
        position: relative;
        width: 168px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
        animation: boot-rise 620ms cubic-bezier(0.2, 0.7, 0.2, 1) 160ms both;
      }
      .boot__bar-fill {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        box-shadow: 0 0 12px rgba(96, 165, 250, 0.6);
        transform: scaleX(0.04);
        transform-origin: left center;
        animation: boot-load 1150ms cubic-bezier(0.25, 0.6, 0.2, 1) forwards;
        transition: transform 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes boot-load { from { transform: scaleX(0.04); } to { transform: scaleX(0.9); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
      @media (prefers-reduced-motion: reduce) {
        .boot__logo, .boot__word, .boot__bar { animation: none; }
        .boot__bar-fill { animation: none; transform: scaleX(0.9); }
        #boot { transition: opacity 120ms linear; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Silicon">
      <div class="boot__logo" aria-hidden="true">
        <!-- This mark is a deliberate match for the NATIVE launch screen's artwork (the glowing chip
             in resources/splash.png), not merely the same motif. It used to be a flat silhouette:
             solid-blue pins, a flat gradient tile, hard white strokes. So the launch sequence went
             rendered-and-glowing (iOS splash) -> flat sketch (this) -> app, and that middle frame is
             the one that read as unfinished. Rebuilt with the artwork's actual character — an outer
             bloom, a deep radial tile, and lit edges — for about 2 KB inline, which is the price of
             keeping it paintable on first parse instead of fetching the real PNG. -->
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bootTile" cx="0.5" cy="0.38" r="0.75">
              <stop offset="0" stop-color="#1b3a7a" />
              <stop offset="0.55" stop-color="#122a5c" />
              <stop offset="1" stop-color="#0d1c3f" />
            </radialGradient>
            <linearGradient id="bootPin" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7cc0ff" />
              <stop offset="1" stop-color="#3b82f6" />
            </linearGradient>
            <filter id="bootGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="9" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <filter id="bootBloom" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
          </defs>
          <!-- Outer bloom: the halo the tile casts onto the dark field. -->
          <g filter="url(#bootBloom)" opacity="0.75">
            <rect x="150" y="150" width="212" height="212" rx="52" fill="#2f6fe0" />
          </g>
          <g fill="url(#bootPin)" filter="url(#bootGlow)">
            <rect x="196" y="112" width="17" height="50" rx="8" />
            <rect x="247" y="112" width="17" height="50" rx="8" />
            <rect x="298" y="112" width="17" height="50" rx="8" />
            <rect x="196" y="350" width="17" height="50" rx="8" />
            <rect x="247" y="350" width="17" height="50" rx="8" />
            <rect x="298" y="350" width="17" height="50" rx="8" />
            <rect x="112" y="196" width="50" height="17" rx="8" />
            <rect x="112" y="247" width="50" height="17" rx="8" />
            <rect x="112" y="298" width="50" height="17" rx="8" />
            <rect x="350" y="196" width="50" height="17" rx="8" />
            <rect x="350" y="247" width="50" height="17" rx="8" />
            <rect x="350" y="298" width="50" height="17" rx="8" />
          </g>
          <rect x="150" y="150" width="212" height="212" rx="52" fill="url(#bootTile)" />
          <rect x="150" y="150" width="212" height="212" rx="52" fill="none" stroke="#9ecbff" stroke-opacity="0.55" stroke-width="3" filter="url(#bootGlow)" />
          <g filter="url(#bootGlow)">
            <path d="M256 188 L324 256 L256 324 L188 256 Z" fill="none" stroke="#eaf4ff" stroke-width="15" stroke-linejoin="round" />
            <circle cx="256" cy="256" r="25" fill="#f4f9ff" />
          </g>
        </svg>
      </div>
      <div class="boot__word">Silicon</div>
      <div class="boot__bar"><div class="boot__bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>window.__bootStart = (window.performance && performance.now) ? performance.now() : Date.now();</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
